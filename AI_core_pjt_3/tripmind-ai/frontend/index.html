<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripMind AI · 국내 여행</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="TripMind AI 홈"><span class="mark" aria-hidden="true">✦</span> TripMind AI</a>
    <nav aria-label="메뉴">
      <button class="tab" data-view="chat" aria-current="page">여행 대화</button>
      <button class="tab" data-view="plans">저장한 계획</button>
      <button class="tab" data-view="logs">실행 로그</button>
    </nav>
  </header>
  <main>
    <section id="chat" class="view">
      <div class="heading">
        <div><p class="location">대한민국</p><h1>국내 여행을 계획하세요</h1></div>
        <button id="new-chat" class="secondary">새 대화</button>
      </div>
      <div class="chat-layout">
        <div class="panel conversation">
          <div id="messages" class="messages" aria-live="polite">
            <p class="message assistant">목적지, 여행 날짜, 가능한 시간대, 방문하고 싶은 장소 수를 알려 주세요. 비가 오면 실내로 바꾸는 조건도 요청할 수 있어요.</p>
          </div>
          <div id="suggestions" class="suggestions">
            <button class="chip" data-example="plan" data-region="부산 해운대구">부산 해운대구 관광지 3곳 추천</button>
            <button class="chip" data-example="rain" data-region="제주시">제주시에서 비가 오면 실내로 변경</button>
          </div>
          <div id="draft" class="draft" hidden></div>
          <form id="chat-form">
            <label class="sr-only" for="message">여행 조건 또는 질문</label>
            <textarea id="message" placeholder="여행 조건이나 질문을 입력하세요" rows="2" maxlength="4000" required></textarea>
            <button id="send" type="submit">보내기</button>
          </form>
          <p id="chat-status" class="status" role="status"></p>
        </div>
        <aside class="panel timeline">
          <h2>실행 과정</h2>
          <p id="event-empty" class="muted">요청을 보내면 각 단계와 Tool 호출을 볼 수 있습니다.</p>
          <ol id="events" class="event-list"></ol>
        </aside>
      </div>
    </section>
    <section id="plans" class="view" hidden>
      <div class="heading"><h1>저장한 계획</h1><button id="refresh-plans" class="secondary">새로고침</button></div>
      <p id="plan-status" class="status" role="status"></p>
      <div class="management"><div id="plan-list" class="panel list"></div><div id="plan-detail" class="panel detail" hidden></div></div>
    </section>
    <section id="logs" class="view" hidden>
      <div class="heading"><h1>실행 로그</h1><button id="refresh-logs" class="secondary">새로고침</button></div>
      <p id="log-status" class="status" role="status"></p>
      <div class="management"><div id="log-list" class="panel list"></div><div id="log-detail" class="panel detail" hidden></div></div>
    </section>
  </main>
</body>
</html>
