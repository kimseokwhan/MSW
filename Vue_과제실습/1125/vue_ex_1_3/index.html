<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <h1>User Profile</h1>
    <p>Name: {{ user.name }}</p>
    <p>Age: {{ user.age }}</p>
    <button v-on:click="changeName">Change Name</button>
    <button v-on:click="changeAge">Change Age</button>
  </div>

  <script src="https://unpkg.com/vue@3.5.44/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue

    const app = createApp({
      setup() {
        const user = ref({
          name: 'Alice',
          age: 30
        })
        const changeName = function () {
          // user.value.name = prompt("Enter new name", user.value.name)
          const name = prompt('Enter new name', user.value.name)
          if(name !== null){
            user.value.name = name
          }
        }
        const changeAge = function () {
          // user.value.age = Number(prompt("Enter new age", user.value.age))
          const age = prompt('Enter new age', user.value.age)
          if(age !== null){
            user.value.age = age
          }
        }

        return { user, changeName, changeAge }
      }
    })
    app.mount('#app')
  </script>
</body>

</html>
