<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THRead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'books:index' %}">THRead</a>

            <div class="d-flex align-items-center gap-3">
                <a class="text-white text-decoration-none" href="{% url 'books:index' %}">INDEX</a>

                {% if request.user.is_authenticated %}
                    <a class="text-white text-decoration-none" href="{% url 'books:create' %}">CREATE</a>
                    <a class="text-white text-decoration-none" href="{% url 'accounts:profile' request.user.username %}">MY PROFILE</a>

                    <form action="{% url 'accounts:logout' %}" method="POST" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link text-white text-decoration-none p-0">LOGOUT</button>
                    </form>

                {% else %}
                    <a class="text-white text-decoration-none" href="{% url 'accounts:login' %}">LOGIN</a>
                    <a class="text-white text-decoration-none" href="{% url 'accounts:signup' %}">SIGNUP</a>

                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
