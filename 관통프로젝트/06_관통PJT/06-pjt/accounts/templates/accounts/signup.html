{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">회원가입</h2>
<form action="{% url 'accounts:signup' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">회원가입</button>
    <a href="{% url 'books:index' %}" class="btn btn-secondary">취소</a>
</form>
{% endblock content %}
