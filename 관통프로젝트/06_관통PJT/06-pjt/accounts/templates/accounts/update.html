{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">회원정보 수정</h2>
<form action="{% url 'accounts:update' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">수정</button>
    <a href="{% url 'accounts:profile' request.user.username %}" class="btn btn-secondary">취소</a>
</form>
<hr>

<a href="{% url 'accounts:change_password' %}">비밀번호 변경</a>
{% endblock content %}
