{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>메인 페이지</h2>
    {% if request.user.is_authenticated %}
        <a href="{% url 'books:create' %}" class="btn btn-primary">도서 등록</a>

    {% endif %}
</div>

<form action="{% url 'books:index' %}" method="GET" class="mb-4">
    <div class="d-flex gap-2">
        <select name="category" class="form-select">
            <option value="">전체 카테고리</option>
            {% for category in categories %}
                <option value="{{ category.pk }}"
                    {% if selected_category == category.pk|stringformat:"s" %}
                        selected
                    
                    {% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-primary">검색</button>
    </div>
</form>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for book in books %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ book.title }}</h5>
                    <p class="card-text">{{ book.description|truncatechars:150 }}</p>
                    <p class="text-muted small">저자: {{ book.author }}</p>
                    <div class="mt-auto">
                        <a href="{% url 'books:detail' book.pk %}" class="btn btn-primary">Detail</a>
                    </div>
                </div>
            </div>
        </div>

    {% empty %}
        <p>등록된 도서가 없습니다.</p>

    {% endfor %}
</div>
{% endblock content %}
