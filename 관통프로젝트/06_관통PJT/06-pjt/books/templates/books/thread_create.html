{% extends 'base.html' %}

{% block content %}
<h2 class="mb-3">쓰레드 작성</h2>
<p class="text-muted">도서: {{ book.title }}</p>
<hr>

<form action="{% url 'books:thread_create' book.pk %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">작성</button>
    <a href="{% url 'books:detail' book.pk %}" class="btn btn-secondary">취소</a>
</form>
{% endblock content %}
