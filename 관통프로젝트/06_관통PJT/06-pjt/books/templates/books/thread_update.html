{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">쓰레드 수정</h2>
<form action="{% url 'books:thread_update' thread.pk %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">수정</button>
    <a href="{% url 'books:thread_detail' thread.pk %}" class="btn btn-secondary">취소</a>
</form>
{% endblock content %}
