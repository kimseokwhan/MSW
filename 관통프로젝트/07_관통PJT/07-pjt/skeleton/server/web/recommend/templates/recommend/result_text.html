{% extends 'base.html' %}
{% block content %}
<div class="panes">
  <div class="pane">
    <h3>사용자 입력</h3>
    {% if uploaded %}<img class="cover" src="{{ uploaded.url }}" alt="업로드한 표지"><br><br>{% endif %}
    <div class="result">{{ user_input }}</div>
    <a class="back" href="{% url request.resolver_match.view_name %}">← 다시 입력</a>
  </div>
  <div class="pane">
    <h3>FastAPI 결과</h3>
    <div class="result">{{ result.content }}</div>
  </div>
</div>
{% endblock content %}
