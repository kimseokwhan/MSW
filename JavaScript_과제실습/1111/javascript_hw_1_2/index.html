<!DOCTYPE html>
<html>
<head>
  <title>나의 포트폴리오</title>
</head>
<body>
  <h1>안녕하세요, 제 이름은 <b id="name">홍길동</b>입니다.</h1>
  
  <!-- <img src="profile.jpg" alt="증명사진" width="200"> -->
  <img src="" alt="" width="200">
  
  <h2>소개</h2>
  <p>저는 <b id="job">[직업/전공]</b>으로 일하고 있습니다. <b id="experience">[간단한 경력/학력]</b>을 가지고 있으며, <b>[특기 또는 관심 분야]</b>에 대해 꾸준히 공부하고 있습니다.</p>
  
  <h2>프로젝트</h2>
  <ul id="list-group">
    <li><b>프로젝트 1:</b> <span class="project-1">[프로젝트 1 제목]</span></li>
    <li><b>프로젝트 2:</b> <span class="project-2">[프로젝트 2 제목]</span></li>
    <li><b>프로젝트 3:</b> <span class="project-3">[프로젝트 3 제목]</span></li>
  </ul>
  
  <h2>연락처</h2>
  <p>이메일: <b id="email">[이메일 주소]</b></p>
  <p>전화번호: <b id="phone">[전화번호]</b></p>
  

  <script>
    const name = document.querySelector('#name')
    name.textContent = '김석환'

    const img = document.querySelector('img')
    img.setAttribute('src', 'profile.jpg')
    img.setAttribute('alt', '프로필 사진')

    const job = document.querySelector('#job')
    job.textContent = 'SSAFY 교육생'

    const experience = document.querySelector('#experience')
    experience.textContent = '1년 경력, 석사 학위'

    const bTag = document.querySelectorAll('p > b')[2]
    bTag.textContent = 'IT PM/기획/관리'

    const project_1 = document.querySelector('.project-1')
    project_1.textContent = '공통'

    const project_2 = document.querySelector('.project-2')
    project_2.textContent = '특화'

    const project_3 = document.querySelector('.project-3')
    project_3.textContent = '자유'

    const email = document.querySelector('#email')
    email.textContent = '1626374@ssafy.com'

    const phone = document.querySelector('#phone')
    phone.textContent = '010-9876-5432'
  </script>
  
</body>
</html>
